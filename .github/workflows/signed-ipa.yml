name: Signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Distribution method matching the provisioning profile
        type: choice
        default: release-testing
        options:
          - release-testing
          - debugging
          - app-store-connect

permissions:
  contents: read

concurrency:
  group: weeknote-signed-ipa
  cancel-in-progress: false

jobs:
  signed-ipa:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EXPORT_METHOD: ${{ inputs.export_method }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: bash scripts/generate-project.sh
      - name: Validate and install signing material
        run: bash scripts/install-signing.sh
      - name: Archive and export signed IPA
        run: bash scripts/build-signed-ipa.sh
      - name: Upload signed IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WEEKNOTE-signed-${{ inputs.export_method }}
          path: |
            build/export/*.ipa
            build/export/*.ipa.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Clean signing material
        if: always()
        run: bash scripts/cleanup-signing.sh

