name: WEEKNOTE
options:
  bundleIdPrefix: com.m1u13
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  xcodeVersion: "16.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
targets:
  WEEKNOTE:
    type: application
    platform: iOS
    sources:
      - path: WEEKNOTE
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m1u13.weeknote
        INFOPLIST_FILE: WEEKNOTE/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WEEKNOTETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WEEKNOTETests
    dependencies:
      - target: WEEKNOTE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m1u13.weeknote.tests
        GENERATE_INFOPLIST_FILE: YES
  WEEKNOTEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WEEKNOTEUITests
    dependencies:
      - target: WEEKNOTE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m1u13.weeknote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WEEKNOTE
schemes:
  WEEKNOTE:
    build:
      targets:
        WEEKNOTE: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WEEKNOTETests
        - WEEKNOTEUITests
      gatherCoverageData: true
      coverageTargets:
        - WEEKNOTE
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
    archive:
      config: Release
